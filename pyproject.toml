[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optionflow-study"
version = "0.1.0"
description = "Panel inference and historical forecast evaluation for commodity option activity"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Yichen Wang"}]
dependencies = ["numpy==2.5.4", "pandas==3.0.6", "scipy==1.18.1", "pyhdfe==0.2.1"]

[tool.setuptools.packages.find]
where = ["src"]
